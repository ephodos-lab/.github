name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove API keys, tokens and private data from everything you paste below.
        Security problems should not be reported here; see the repository's Security tab.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python or Node version, project version or commit, and the model and provider if an AI agent is involved.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: text
  - type: checkboxes
    id: secrets
    attributes:
      label: Privacy
      options:
        - label: I removed keys, tokens and private data from this report.
          required: true
